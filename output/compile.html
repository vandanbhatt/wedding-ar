<!DOCTYPE html>
<html>
<head>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"></script>
</head>
<body>
  <h1>Compiling...</h1>
  <div id="status">Loading...</div>
  <script>
    async function run() {
      const statusDiv = document.getElementById('status');
      try {
        statusDiv.innerText = "Loading image...";
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.src = "card_front.jpg";
        await new Promise((resolve, reject) => {
          img.onload = resolve;
          img.onerror = reject;
        });

        statusDiv.innerText = "Compiling target...";
        const compiler = new MINDAR.IMAGE.Compiler();
        await compiler.compileImageTargets([img], (progress) => {
          statusDiv.innerText = "Progress: " + Math.round(progress) + "%";
        });

        statusDiv.innerText = "Exporting data...";
        const buffer = await compiler.exportData();
        
        // Convert to base64 so headless chrome can retrieve it
        let binary = '';
        const bytes = new Uint8Array(buffer);
        const len = bytes.byteLength;
        for (let i = 0; i < len; i++) {
          binary += String.fromCharCode(bytes[i]);
        }
        window.__MIND_DATA__ = btoa(binary);
        statusDiv.innerText = "DONE:" + bytes.byteLength;
      } catch (e) {
        statusDiv.innerText = "ERROR: " + e.message;
        console.error(e);
      }
    }
    run();
  </script>
</body>
</html>
